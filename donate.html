<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Donate - Alex Kirs</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <nav><a href="/">← Home</a></nav>
    <h1>Donate<span aria-hidden="true">.</span></h1>
    <p>If you find my work useful, you can support it here. Thank you.</p>
    <section class="donation" aria-labelledby="crypto-heading">
      <h2 id="crypto-heading">USDT / BNB / ETH</h2>
      <p class="donation-networks">BNB Smart Chain, Ethereum, Base</p>
      <p>Send only on the listed networks.</p>
      <img class="donation-qr" src="/donate-qr.png" width="246" height="246" alt="QR code for the wallet address below">
      <p class="wallet-address" id="wallet-address">0xF68639DA4C0a0670ee3712F0ae46b2C03C59aDCc</p>
      <button type="button" id="copy-address">Copy address</button>
      <p class="copy-status" id="copy-status" role="status"></p>
    </section>
  </main>
  <script>
    document.getElementById('copy-address').addEventListener('click', async () => {
      const address = document.getElementById('wallet-address').textContent;
      const status = document.getElementById('copy-status');
      try {
        await navigator.clipboard.writeText(address);
        status.textContent = 'Address copied.';
      } catch {
        status.textContent = 'Could not copy. Select and copy the address above.';
      }
    });
  </script>
</body>
</html>
